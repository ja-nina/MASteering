# CPU-only env for developing and testing the games (no GPU, no vLLM): pytest runs everything
# except the engines. GPU runs use the PersVecFast env instead (see README).
name: ma-testbed
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pytorch::pytorch=2.4.*
  - pip>=23
  - pip:
    - -r requirements.txt
