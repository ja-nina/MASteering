training:
  game: TruthAndDeception-v0
  num_players: 2
  episodes: 500        # number of GRPO update steps
  grpo_k: 8           # rollouts per step — higher = lower variance, more GPU time
  max_turns: 40
  max_new_tokens: 1024  # per-turn generation cap

model:
  base: Qwen/Qwen3-4B
  dtype: bfloat16

use_persona_lora: true   # set false (or --no-persona-lora) to train only adapter_b

lora_a:  # SVD persona LoRA (maximiser) — lora_B frozen to Vk cols; lora_A trains
  rank: 32              # 32 SVD components in basis (--rank 32); vLLM max_lora_rank=32
  alpha: 32
  targets: [o_proj]    # SVD basis lives in o_proj output space (2560-dim)
  dropout: 0.0          # frozen B is not dropped; A can use dropout if needed
  basis_path: /BS/ForNet/work/MASteering/data/svd_basis/qwen3-4b-attn-with-amoral.pt   # attn_delta basis (o_proj outputs, not residual)

lora_b:  # standard LoRA baseline — same target module as adapter_a, free weights
  rank: 16
  alpha: 32
  targets: [o_proj]
  dropout: 0.05

probe:
  basis_path: data/svd_basis/qwen3-4b-residual.pt
  hook: residual
  reward_layer_start: 10    # sum cosine-sim reward over layers [10, last]
  display_layer: 35         # layer used for rank_traits / wandb trait labels

reward:
  # Both adapters maximise cosine-sim to this weighted trait direction.
  # adapter_a (persona LoRA) is constrained to SVD axes; adapter_b is a free
  # LoRA baseline.  Same objective, different parameterisation.
  target_traits:
    empathy: 2.0
  # Dense reward mix: alpha weights the opponent's reaction (primary signal —
  # did my words shift the opponent's internal state?); beta weights the
  # trainee's own representation (secondary — is the trainee "in character"?).
  alpha: 1.0
  beta: 0.0

optimizer:
  lr: 1.0e-4
  max_grad_norm: 1.0

output:
  save_dir: outputs/lora/persona_truth_deception
  log_interval: 10        # console print interval (unused now — printed every step)
  save_interval: 50
  log_transcript_every: 10  # detailed K-candidate Table; HTML transcript logs every step

wandb:
  enabled: true
  project: ma-steering-lora
  name: persona-truth-deception
  tags: [grpo, svd-lora, TruthAndDeception-v0]
