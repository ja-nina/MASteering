training:
  mode: persona
  game: TruthAndDeception-v0
  num_players: 2
  episodes: 500
  max_turns: 40
  gamma: 0.99

model:
  base: Qwen/Qwen3-4B
  dtype: bfloat16

lora:
  rank: 16
  alpha: 32
  targets: [q_proj, v_proj, o_proj]
  dropout: 0.05

probe:
  basis_path: data/svd_basis/qwen3-4b-attn.pt
  layer: 18
  hook: attn

reward:
  mode: persona
  target_traits:
    agreeable: 1.5
    warm: 1.0
    deceptive: -0.5

optimizer:
  lr: 1.0e-4
  max_grad_norm: 1.0

output:
  save_dir: outputs/lora/persona_truth_deception
  log_interval: 10
  save_interval: 50
