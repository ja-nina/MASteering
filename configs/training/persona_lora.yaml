training:
  game: TruthAndDeception-v0
  num_players: 2
  episodes: 500        # number of GRPO update steps
  grpo_k: 4           # rollouts per step — higher = lower variance, more GPU time
  max_turns: 40

model:
  base: Qwen/Qwen3-4B
  dtype: bfloat16

use_persona_lora: true   # set false (or --no-persona-lora) to train only adapter_b

lora_a:  # SVD persona LoRA (maximiser) — lora_B frozen to Vk cols; lora_A trains
  rank: 16              # should be ≤ k (# SVD components); excess cols zeroed
  alpha: 32
  targets: [o_proj]    # SVD basis lives in o_proj output space (2560-dim)
  dropout: 0.0          # frozen B is not dropped; A can use dropout if needed

lora_b:  # standard LoRA (minimiser) — pushed AWAY from target traits
  rank: 16
  alpha: 32
  targets: [q_proj, v_proj, o_proj]
  dropout: 0.05

probe:
  basis_path: data/svd_basis/qwen3-4b-attn.pt
  layer: 18
  hook: attn

reward:
  # LoRA A maximises cosine sim to the weighted direction of these traits.
  maximize_traits:
    agreeable: 1.5
    warm: 1.0
  # LoRA B minimises cosine sim to the weighted direction of these traits
  # (equivalently, sign=-1 reward).
  minimize_traits:
    deceptive: 1.0
    dominant: 0.5

optimizer:
  lr: 1.0e-4
  max_grad_norm: 1.0

output:
  save_dir: outputs/lora/persona_truth_deception
  log_interval: 10
  save_interval: 50

wandb:
  enabled: true
  project: ma-steering-lora
  name: persona-truth-deception
  tags: [grpo, svd-lora, TruthAndDeception-v0]
