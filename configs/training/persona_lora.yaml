training:
  game: TruthAndDeception-v0
  num_players: 2
  episodes: 500
  max_turns: 40
  gamma: 0.99

model:
  base: Qwen/Qwen3-4B
  dtype: bfloat16

lora_a:  # maximiser adapter — pushed TOWARD target traits
  rank: 16
  alpha: 32
  targets: [q_proj, v_proj, o_proj]
  dropout: 0.05

lora_b:  # minimiser adapter — pushed AWAY from target traits
  rank: 16
  alpha: 32
  targets: [q_proj, v_proj, o_proj]
  dropout: 0.05

probe:
  basis_path: data/svd_basis/qwen3-4b-attn.pt
  layer: 18
  hook: attn

reward:
  # LoRA A maximises cosine sim to the weighted direction of these traits.
  maximize_traits:
    agreeable: 1.5
    warm: 1.0
  # LoRA B minimises cosine sim to the weighted direction of these traits
  # (equivalently, sign=-1 reward).
  minimize_traits:
    deceptive: 1.0
    dominant: 0.5

optimizer:
  lr: 1.0e-4
  max_grad_norm: 1.0

output:
  save_dir: outputs/lora/persona_truth_deception
  log_interval: 10
  save_interval: 50
