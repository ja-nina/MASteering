run_id: overcooked_noop_2p
game:
  family: symbolic
  id: overcooked
  env_kwargs:
    num_players: 2
    layout: cramped_room   # "cramped_room" | "asymmetric_adv" | "coordination_ring"
    max_steps: 400
    cook_time: 4
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: parallel   # simultaneous: both players act each step
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/overcooked/
