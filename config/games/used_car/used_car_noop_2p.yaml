# UsedCarNegotiation via TextArena (UsedCarNegotiation-v0)
# 2 players: a Seller and a Buyer negotiate a used car price over multiple rounds.
# Each player has a private reservation price; the game ends on agreement or timeout.
# Tests asymmetric-information negotiation and concession strategies.
run_id: used_car_noop_2p
game:
  family: textarena
  id: UsedCarNegotiation-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/used_car/
