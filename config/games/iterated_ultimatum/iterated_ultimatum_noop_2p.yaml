# IteratedUltimatumGame via TextArena (IteratedUltimatumGame-v0)
# 2 players: classic iterated Ultimatum Game. The Proposer offers a split of a
# fixed sum; the Responder accepts (both get their shares) or rejects (both get
# nothing). Roles may alternate across rounds. Tests fairness norms and bargaining.
run_id: iterated_ultimatum_noop_2p
game:
  family: textarena
  id: IteratedUltimatumGame-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/iterated_ultimatum/
