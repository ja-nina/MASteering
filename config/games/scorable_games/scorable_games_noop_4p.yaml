# ScorableGames via TextArena (ScorableGames-v0)
# 4 players: agents compete across a collection of scorable mini-games.
# TextArena handles game selection, scoring, and cumulative reward tracking.
run_id: scorable_games_noop_4p
game:
  family: textarena
  id: ScorableGames-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/scorable_games/
