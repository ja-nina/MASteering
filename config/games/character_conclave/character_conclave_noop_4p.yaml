# CharacterConclave via TextArena (CharacterConclave-v0)
# 4 players: each adopts a secret character persona and engages in discussion.
# Players vote on who best embodied their assigned character; highest votes wins.
# TextArena handles character assignment, discussion rounds, and voting internally.
run_id: character_conclave_noop_4p
game:
  family: textarena
  id: CharacterConclave-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/character_conclave/
