# ThreePlayerIPD via TextArena (ThreePlayerIPD-v0)
# 3 players: each simultaneously chooses to Cooperate or Defect in an iterated
# Prisoner's Dilemma. Payoffs depend on how many others cooperate vs defect.
# TextArena handles round structure, payoff computation, and scoring internally.
run_id: three_player_ipd_noop_3p
game:
  family: textarena
  id: ThreePlayerIPD-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 3
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/three_player_ipd/
