# LiarsDice via TextArena (LiarsDice-v0)
# 3 players: each holds a hidden set of dice and takes turns making escalating
# bids on the total count of a face value across all dice. Players may call "Liar"
# to challenge the previous bid; if the bid was false the bidder loses, else the
# challenger loses.
run_id: liars_dice_noop_3p
game:
  family: textarena
  id: LiarsDice-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 3
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/liars_dice/
