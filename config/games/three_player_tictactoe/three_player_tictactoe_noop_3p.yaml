# ThreePlayerTicTacToe via TextArena (ThreePlayerTicTacToe-v0)
# 3 players: X, O, and Triangle compete on a shared Tic-Tac-Toe board.
# First player to complete three-in-a-row with their symbol wins.
# TextArena handles board state, turn order, and win detection internally.
run_id: three_player_tictactoe_noop_3p
game:
  family: textarena
  id: ThreePlayerTicTacToe-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 3
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/three_player_tictactoe/
