run_id: hanabi_noop_3p
game:
  family: symbolic
  id: hanabi
  env_kwargs:
    num_players: 3
episodes: 50
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 3
  concurrency: sequential   # turn-based: concurrency=sequential is correct
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/hanabi/
