# TwoRoomsAndABoom via TextArena (TwoRoomsAndABoom-v0)
# 6 players: split across two rooms with hidden roles (President, Bomber, team members).
# The Bomber team wins if the Bomber ends in the same room as the President at game end.
# TextArena handles role assignment, room swaps, and win condition evaluation internally.
run_id: two_rooms_noop_6p
game:
  family: textarena
  id: TwoRoomsAndABoom-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 6
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/two_rooms/
