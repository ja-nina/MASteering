# TruthAndDeception via TextArena (TruthAndDeception-v0)
# 2 players: one Truth-teller, one Deceiver. The Deceiver tries to mislead the
# Truth-teller about hidden facts; the Truth-teller must identify the deception.
# TextArena handles fact assignment, questioning turns, and evaluation internally.
run_id: truth_and_deception_noop_2p
game:
  family: textarena
  id: TruthAndDeception-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/truth_and_deception/
