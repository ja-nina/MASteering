run_id: debate_activation_p1_sycophantic_rotation_2p
game:
  family: textarena
  id: Debate-v0
  env_kwargs:
    jury_model: meta-llama/llama-3.3-70b-instruct
    jury_size: 1
episodes: 50
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: activation
  mode: rotation
  per_agent:
    player_1:
      vector_path: ${PERSONA_VECTORS_ROOT}/bf16/sycophantic.pt
      coefficient: 0.3
      layer_path_template: model.layers.{}
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layers: [10, 20, 29]
  layer_path_template: model.layers.{}
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/debate/
