# Debate via TextArena (Debate-v0)
# 2 players: one argues FOR the topic, one AGAINST. A judge scores persuasiveness.
# TextArena handles topic assignment, turn-taking, and judging internally.
run_id: debate_noop_2p
game:
  family: textarena
  id: Debate-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/debate/
