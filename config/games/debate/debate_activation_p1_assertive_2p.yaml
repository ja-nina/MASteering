# Debate-v0 — activation steering on player_1 (AGAINST / Non-Affirmative side)
#
# In Debate-v0 roles are structural: player_0 argues FOR, player_1 AGAINST.
# We use plain ActivationSteering with a static per_agent override on player_1.
#
# Vector: assertive (bf16, PersVecGen)
#   Layer auto-selected from companion .json (highest delta at max coefficient).
#   Requires env var: PERSONA_VECTORS_ROOT
#     local:   C:\Users\ismyn\UNI\MPI\Thesis\PersVecGen\data\vector_extraction\persona\qwen3-14b
#     cluster: set in your SLURM script
#
# Mode: adaptive (soft top-up, never overshoots — same formula as PersVecGen steering.py)
# Coefficient: 1.25 (mid-point of the extraction sweep range 0–2.5)

run_id: debate_activation_p1_assertive_2p
game:
  family: textarena
  id: Debate-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: activation
  per_agent:
    player_1:                          # AGAINST / Non-Affirmative side
      vector_path: ${PERSONA_VECTORS_ROOT}/bf16/assertive.pt
      coefficient: 1.25
      layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layer: 20
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/debate/
