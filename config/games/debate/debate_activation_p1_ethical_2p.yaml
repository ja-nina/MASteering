# Debate-v0 — AGAINST side (player_1) steered toward ethical
#
# Research question: does moral integrity strengthen or weaken an adversarial
# argument? An ethical debater may refuse to use strawman arguments or
# hyperbole, instead engaging the opponent's position honestly — which could
# either be more persuasive (credibility) or less effective (pulling punches).
# Compare win rate and probe spill-over: does ethical steering also shift
# player_0's probe scores (contagion effect)?
#
# Mode: adaptive, coefficient: 1.25

run_id: debate_activation_p1_ethical_2p
game:
  family: textarena
  id: Debate-v0
  env_kwargs: {}
episodes: 50
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: activation
  per_agent:
    player_1:
      vector_path: ${PERSONA_VECTORS_ROOT}/bf16/ethical.pt
      coefficient: 1.25
      layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layer: 20
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/debate/
