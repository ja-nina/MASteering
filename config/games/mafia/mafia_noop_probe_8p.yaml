# SecretMafia-v0 — no steering, probing enabled (control condition)
# Use this alongside mafia_activation_wolf_opportunistic_8p.yaml to compare
# how persona traits manifest with vs. without steering.
run_id: mafia_noop_probe_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 50
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layers: [10, 20, 29]
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/mafia/
