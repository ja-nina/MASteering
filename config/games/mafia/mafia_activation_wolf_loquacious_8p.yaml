# SecretMafia-v0 — Mafia wolf steered toward loquacious
#
# Research question: does verbosity increase the wolf's tell rate?
# More tokens = more opportunities to contradict earlier statements or reveal
# reasoning that betrays the mafia role. Compare information leakage in
# chunk-level probe traces vs. the terse noop baseline.
#
# Mode: adaptive, coefficient: 1.25 (mid-sweep)

run_id: mafia_activation_wolf_loquacious_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: role_aware_activation
  target_roles:
    - mafia
  default_config:
    vector_path: ${PERSONA_VECTORS_ROOT}/bf16/loquacious.pt
    coefficient: 1.25
    layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layer: 20
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/mafia/
