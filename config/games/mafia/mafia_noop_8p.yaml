# SecretMafia via TextArena (SecretMafia-v0)
# 8 players: ~2 mafia (ratio=0.25), 6 civilians, 3 discussion rounds per day.
# TextArena handles role assignment, discussion, and voting internally.
run_id: mafia_noop_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/mafia/
