# SecretMafia-v0 — activation steering on the Mafia player(s)
#
# Steering method: role_aware_activation
#   - After each env.reset() the Mafia player seat(s) are discovered from the
#     game's internal role dict and armed with the opportunistic vector.
#   - All other players receive no steering (noop behaviour).
#
# Vector: opportunistic (bf16, PersVecGen)
#   Layer auto-selected from companion .json (highest delta at max coefficient).
#   Requires env var: PERSONA_VECTORS_ROOT
#     local:   C:\Users\ismyn\UNI\MPI\Thesis\PersVecGen\data\vector_extraction\persona\qwen3-14b
#     cluster: set in your SLURM script
#
# Mode: adaptive (soft top-up, never overshoots — same formula as PersVecGen steering.py)
# Coefficient: 1.25 (mid-point of the extraction sweep range 0–2.5)

run_id: mafia_activation_wolf_opportunistic_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 50
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: role_aware_activation
  target_roles:
    - mafia              # SecretMafia-v0 uses this string for the Mafia faction
  default_config:
    vector_path: ${PERSONA_VECTORS_ROOT}/bf16/opportunistic.pt
    coefficient: 1.25
    layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layers: [10, 20, 29]
  layer_path_template: "model.layers.{}"
  window_tokens: 10          # EMA window over last 10 generated tokens
  top_k: 5
logging:
  dir: logs/mafia/
