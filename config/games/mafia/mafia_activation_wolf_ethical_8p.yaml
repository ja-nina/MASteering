# SecretMafia-v0 — Mafia wolf steered toward ethical
#
# Research question (positive-trait paradox): does an ethics-driven internal
# compass prevent the wolf from deceiving? Hypotheses:
#   A) the wolf refuses to lie outright, revealing itself quickly
#   B) the model resolves the tension by generating careful, hedged language
#      that ironically reads as more suspicious
#   C) the vector is suppressed by the role context with minimal behavioural change
# Compare probe time-series: does the ethical projection decay as the episode
# progresses and game pressure mounts?
#
# Mode: adaptive, coefficient: 1.25

run_id: mafia_activation_wolf_ethical_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: role_aware_activation
  target_roles:
    - mafia
  default_config:
    vector_path: ${PERSONA_VECTORS_ROOT}/bf16/ethical.pt
    coefficient: 1.25
    layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layer: 20
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/mafia/
