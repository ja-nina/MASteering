# SecretMafia-v0 — Mafia wolf steered toward trustworthiness
#
# Research question (paradox condition): does steering the wolf toward trustworthy
# behaviour actually improve deception, letting them survive longer? Or does the
# model's own inference suppress the vector and maintain mafia-like behaviour?
# Compare survival rounds vs. noop and opportunistic baselines.
#
# Mode: adaptive, coefficient: 1.25 (mid-sweep)

run_id: mafia_activation_wolf_trustworthiness_8p
game:
  family: textarena
  id: SecretMafia-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 8
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: role_aware_activation
  target_roles:
    - mafia
  default_config:
    vector_path: ${PERSONA_VECTORS_ROOT}/bf16/trustworthiness.pt
    coefficient: 1.25
    layer_path_template: "model.layers.{}"
probing:
  enabled: true
  vectors_dir: ${PERSONA_VECTORS_ROOT}/bf16
  layer: 10
  layer_path_template: "model.layers.{}"
  window_tokens: 10
  top_k: 5
logging:
  dir: logs/mafia/
