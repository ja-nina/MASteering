# HighSociety via TextArena (HighSociety-v0)
# 4 players: agents bid on luxury items at auction using a fixed hand of money cards.
# TextArena handles auction rounds, bidding, and final wealth-based scoring.
run_id: high_society_noop_4p
game:
  family: textarena
  id: HighSociety-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/high_society/
