# IteratedPrisonersDilemma via TextArena (IteratedPrisonersDilemma-v0)
# 2 players: classic iterated Prisoner's Dilemma. Each round both simultaneously
# choose to Cooperate or Defect. Mutual cooperation yields the highest joint payoff;
# unilateral defection yields a higher individual payoff at the other's expense.
run_id: iterated_ipd_noop_2p
game:
  family: textarena
  id: IteratedPrisonersDilemma-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/iterated_ipd/
