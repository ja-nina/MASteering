# PublicGoodsGame via TextArena (PublicGoodsGame-v0)
# 4 players: each round agents decide how much to contribute to a public pool.
# TextArena handles contribution collection, pool multiplication, and payoffs.
run_id: public_goods_noop_4p
game:
  family: textarena
  id: PublicGoodsGame-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/public_goods/
