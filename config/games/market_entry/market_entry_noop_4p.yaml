# MarketEntryGame via TextArena (MarketEntryGame-v0)
# 4 players: agents simultaneously decide whether to enter a market with limited capacity.
# TextArena handles entry decisions, capacity constraints, and profit/loss payoffs.
run_id: market_entry_noop_4p
game:
  family: textarena
  id: MarketEntryGame-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/market_entry/
