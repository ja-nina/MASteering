# SimpleBlindAuction via TextArena (SimpleBlindAuction-v0)
# 4 players: each submits sealed bids on items without seeing others' bids.
# Highest bidder wins each item; players balance budget and item valuations.
# TextArena handles item presentation, blind bidding, and scoring internally.
run_id: blind_auction_noop_4p
game:
  family: textarena
  id: SimpleBlindAuction-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/blind_auction/
