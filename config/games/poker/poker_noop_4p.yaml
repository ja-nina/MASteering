# Poker via TextArena (Poker-v0)
# 4 players: agents play heads-up poker with betting, bluffing, and hand evaluation.
# TextArena handles card dealing, betting rounds, showdowns, and chip tracking.
run_id: poker_noop_4p
game:
  family: textarena
  id: Poker-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/poker/
