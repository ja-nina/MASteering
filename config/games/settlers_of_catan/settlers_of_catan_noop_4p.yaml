# SettlersOfCatan via TextArena (SettlersOfCatan-v0)
# 4 players: agents collect resources, build settlements/cities/roads, and trade.
# TextArena handles board state, resource distribution, and victory point tracking.
run_id: settlers_of_catan_noop_4p
game:
  family: textarena
  id: SettlersOfCatan-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/settlers_of_catan/
