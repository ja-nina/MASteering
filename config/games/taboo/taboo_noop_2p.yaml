# Taboo via TextArena (Taboo-v0)
# 2 players: one Clue Giver must describe a target word without using forbidden words,
# one Guesser tries to identify the target word.
# TextArena handles word assignment, forbidden word enforcement, and scoring internally.
run_id: taboo_noop_2p
game:
  family: textarena
  id: Taboo-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/taboo/
