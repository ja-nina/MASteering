# ThreePlayerGOPS via TextArena (ThreePlayerGOPS-v0)
# 3 players: Game of Pure Strategy — each player bids cards to win point cards
# auctioned in sequence. Highest bid wins the point card; ties split points.
# TextArena handles card dealing, bidding rounds, and scoring internally.
run_id: three_player_gops_noop_3p
game:
  family: textarena
  id: ThreePlayerGOPS-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 3
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/three_player_gops/
