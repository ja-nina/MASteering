# Diplomacy via TextArena (Diplomacy-v0)
# No custom adapter needed — TextArenaAdapter handles this game_id out of the box.
run_id: diplomacy_noop_7p
game:
  family: textarena
  id: Diplomacy-v0
  env_kwargs: {}
episodes: 20
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 7
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/diplomacy/
