# Codenames via TextArena (Codenames-v0)
# 4 players: two teams (Red and Blue), each with a Spymaster and an Operative.
# Spymasters give one-word clues linking multiple cards; Operatives guess their team's words.
# TextArena handles board setup, clue validation, and win detection internally.
run_id: codenames_noop_4p
game:
  family: textarena
  id: Codenames-v0
  env_kwargs: {}
episodes: 100
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 4
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/codenames/
