# SimpleNegotiation via TextArena (SimpleNegotiation-v0)
# 2 players: one Buyer, one Seller negotiate a deal over items and prices.
# TextArena handles item assignment, offer/counter-offer turns, and scoring internally.
run_id: negotiation_noop_2p
game:
  family: textarena
  id: SimpleNegotiation-v0
  env_kwargs: {}
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 2
  concurrency: sequential
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/negotiation/
