run_id: werewolf_noop_6p
game:
  family: symbolic
  id: werewolf
  env_kwargs:
    num_players: 6
    discussion_rounds_per_day: 1   # each player speaks once before voting
episodes: 30
model:
  backend: transformers
  model_id: Qwen/Qwen3-14B
  enable_thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
agents:
  count: 6
  concurrency: sequential   # night phases are sequential; day discussion is per-speaker
  max_parse_retries: 5
steering:
  default: noop
  per_agent: {}
logging:
  dir: logs/werewolf/
