# Game groups left out of every report and analysis (scripts/report.py and steering_mini_report.py via report.load;
# the thesis analyses read this file too). Each entry says why and what replaces it.
#
# The sweeps that rerun these games (and their other-model versions, <name>_<model>): nothing is left out of them.
reruns: [tafix, longctx]

# 2026-11-02: TextArena games whose whole answer (reasoning included; thinking mode is off) was sent to the game as
# the move and posted to every player, leaking private information (hole cards, dice, valuations, the move before a
# simultaneous decision). Found with scripts/check_leak.py. Rerun with the answer marker (only the text after
# 'ACTION:' reaches the game): config/sweeps/tafix.yaml. Not merged with these runs.
textarena_answer_leak:
  - poker_4p
  - liars_dice_3p
  - blind_auction_2p
  - iterated_ultimatum_2p
  - iterated_ipd_2p
  - settlers_of_catan_4p

# 2026-11-02: TextArena games whose prompts outgrew main's 16384-token context (finish_reason prompt_too_long: empty
# answer, parser fallback; scripts/scan_context.py). In public goods and market entry mostly because TextArena kept
# asking an eliminated player again until max_turns (the stuck, steered games), in codenames from long games. Left
# out WHOLE (every condition, baseline included): dropping only the stuck episodes would drop exactly the games
# steering broke. Rerun with skip_eliminated and a 32768 context: config/sweeps/longctx.yaml. Not merged.
# Codenames has no replacement: dropped from the thesis (2026-11-04, see the codenames note in longctx.yaml).
textarena_context_overflow:
  - public_goods_4p
  - market_entry_4p
  - codenames_4p
