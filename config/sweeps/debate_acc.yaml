# Accuracy debate (2026-11-17): does persona steering make a group of agents better or worse at getting a question
# right, and how does that change with group size? N agents answer the same question, read each other's answers and
# reasoning, revise over 3 rounds; scored on correctness (testbed/envs/symbolic/qa_debate.py, Du et al. 2023).
# N = 1 is the no-debate baseline (the same 3 rounds, alone). Two question sets: GSM8K (math, numeric answer) and
# MMLU-Pro (14 subjects, up to 10 options).
# 2026-11-18: GSM8K was too easy (one 9B agent: ~92% right, so no room for debate or steering to help). Added
# SuperGPQA 'hard' (mostly science and engineering, up to 10 options), aiming for 30-50% for one agent; check the
# baseline first with config/sweeps/debate_hard_pilot.yaml. Pilot: one 9B agent 0.64 (N=1), above that.
# Added Humanity's Last Exam, text-only multiple choice (513 questions, 5-26 options, chance ~16%); its question
# file is not in git: build testbed/data/hle.jsonl first (scripts/make_debate_data.py docstring). Episode i plays question i in every run and at every N (uses_episode),
# so all conditions and group sizes answer the same 50 questions per set.
# Settings as main_v2 (model, vectors, monitor, engine, token budget), except: traits without trustworthiness
# (dropped from the thesis), |c| <= 1 only, conditions none / one / all / all_random / prompt_one / prompt_all.
#   1. python scripts/make_configs.py config/sweeps/debate_acc.yaml
#   2. bash scripts/slurm/submit_sweep.sh config/runs/debate_acc 400      (gpu-a40, 2 GPUs: run_games.sbatch)
name: debate_acc
model: qwen3.5-9b
episodes: 50
max_tokens: 15360
cutoff_feedback: true
max_turns: 10                        # 3 rounds
max_parse_retries: 3
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
monitor: {layers: auto}
engine:
  concurrent_episodes: 64
  max_model_len: 32768
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}

# 2B pilot (make_configs --model qwen3.5-2b -> config/runs/debate_acc_qwen3.5-2b): both engines on one GPU (submit
# with --gres=gpu:1), as main_v2's 2B. Vectors: the FIRST 2B extraction (out/, as main_qwen3.5-2b), not main_v2's
# out_v2: on 2026-11-17 out_v2 held only _stage (extraction unfinished) and every 2B run stopped at 'no sweep_scores'.
models:
  qwen3.5-2b:
    vectors_dir: /scratch/inf0/user/nzukowsk/PersVecFast/out/persona/qwen3.5-2b/bf16
    engine: {concurrent_episodes: 128, aperture_gib: 4,
             steer: {gpus: "0", memory: 0.35}, monitor: {gpus: "0", memory: 0.4}}

traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness]
coefficients: [-1, -0.5, 0.5, 1]

conditions:
  none: null
  one: {select: one}
  all: {select: all}
  all_random: {select: all, random_control: true}
  prompt_one: {select: one, via: prompt}
  prompt_all: {select: all, via: prompt}

games:
  qa_debate:    {family: symbolic, id: qa_debate, players: [1, 2, 3, 4, 5], env_kwargs: {dataset: gsm8k, num_rounds: 3}}
  qa_debate_mc: {family: symbolic, id: qa_debate, players: [1, 2, 3, 4, 5], env_kwargs: {dataset: mmlu_pro, num_rounds: 3}}
  qa_debate_hard: {family: symbolic, id: qa_debate, players: [1, 2, 3, 4, 5], env_kwargs: {dataset: supergpqa, num_rounds: 3}}
  qa_debate_hle:  {family: symbolic, id: qa_debate, players: [1, 2, 3, 4, 5], env_kwargs: {dataset: hle, num_rounds: 3}}
