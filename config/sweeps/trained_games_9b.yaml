# main_v2's games on 9B with the trained persona vectors at layer 16 next to the extracted (source) vectors at the
# same layer (2026-11-26); the 9B twin of trained_games (2B, layer 12). Trained: PersVecTrain lambda 10, 2048-token KL
# window, from two runs: 9b_l16_solo_kl10_t2048 (assertive, sycophantic, opportunistic, empathy, sarcastic) and
# 9b_l16ea_solo_kl10_t2048 (evil, agreeableness). Every trait at layer 16, also evil and agreeableness: main_v2's
# auto layer put those two at 8, where the persona judge shows no steering on 9B (source and trained: evil ~5/100 at
# c = +1, agreeableness stays ~92 at c = -1); at 16 evil reaches 70 / 58 and agreeableness drops to 55 / 53.
# This sweep plays its own baseline and source cells (same seeds per run_id), like trained_games.
# Same as trained_games otherwise, except c also +-2: games (main_v2's >= 80 % complete), conditions, 20 episodes, the
# TextArena fixes; the 9B engine of main_v2 (two GPUs per job).
#   1. vectors + prompt traits_dir (export_trained_vectors.py takes both runs):
#      python scripts/export_trained_vectors.py --suffix kl10t2048 #        --source  /scratch/inf0/user/nzukowsk/PersVecFast/out/persona/qwen3.5-9b/bf16 #        --trained /scratch/inf0/user/nzukowsk/PersVecFast/out/trained/9b_l16_solo_kl10_t2048/persona/qwen3.5-9b/bf16 #                  /scratch/inf0/user/nzukowsk/PersVecFast/out/trained/9b_l16ea_solo_kl10_t2048/persona/qwen3.5-9b/bf16 #        --out     /scratch/inf0/user/nzukowsk/PersVecFast/out_games_9b_kl10t2048/persona/qwen3.5-9b/bf16 #        --traits-src /scratch/inf0/user/nzukowsk/PersVecFast/data/persona_vectors #        --traits-out /scratch/inf0/user/nzukowsk/PersVecFast/out_games_9b_kl10t2048/persona_vectors
#   2. python scripts/make_configs.py config/sweeps/trained_games_9b.yaml
#   3. PART=1/2 bash scripts/slurm/submit_sweep.sh config/runs/trained_games_9b 400 -p gpu-l40 --gres=gpu:2 --time=8:00:00
#      PART=2/2 bash scripts/slurm/submit_sweep.sh config/runs/trained_games_9b 400 -p gpu-a40 --exclude=gpu22-a40-05,gpu22-a40-06 --gres=gpu:2 --time=8:00:00
name: trained_games_9b
model: qwen3.5-9b
vectors_dir: /scratch/inf0/user/nzukowsk/PersVecFast/out_games_9b_kl10t2048/persona/qwen3.5-9b/bf16
traits_dir: /scratch/inf0/user/nzukowsk/PersVecFast/out_games_9b_kl10t2048/persona_vectors
episodes: 20
max_tokens: 15360
cutoff_feedback: true
max_turns: 200
max_parse_retries: 3
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
image_size: 448
monitor: {layers: auto}
engine:                              # main_v2's 9B engine: steering and capture on two GPUs (--gres=gpu:2)
  concurrent_episodes: 64
  max_model_len: 32768
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}

traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness,
         evil-kl10t2048, sarcastic-kl10t2048, empathy-kl10t2048, assertive-kl10t2048, sycophantic-kl10t2048,
         opportunistic-kl10t2048, agreeableness-kl10t2048]
coefficients: [-2, -1, -0.5, 0.5, 1, 2]   # +-2 asked for (main_v2's ends); the vectors were checked at |c| <= 1 only

conditions:
  none: null
  one: {select: one, layer: 16}
  half: {select: fraction, fraction: 0.5, layer: 16}
  all: {select: all, layer: 16}
  evil_team: {team: evil, layer: 16}
  evil_one: {team: evil, select: one, layer: 16}
  good_one: {team: good, select: one, layer: 16}
  good_team: {team: good, layer: 16}
  all_random: {select: all, layer: 16, random_control: true}
  prompt_one: {select: one, via: prompt,
               grid_traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness]}
  prompt_all: {select: all, via: prompt,
               grid_traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness]}
  both_one: {select: one, via: both, layer: 16}
  evil_team_prompt: {team: evil, via: prompt,
                     grid_traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness]}

games:                               # main_v2's entries, those >= 80 % complete there
  gbs:            {family: symbolic, id: gbs, players: [3], observation: [text, image]}
  gbs_picking:    {family: symbolic, id: gbs, players: [5], env_kwargs: {hide_group_size: true, feedback: directional}}
  beauty_contest: {family: symbolic, id: beauty_contest, players: [3], observation: [text, image]}
  harvest:        {family: symbolic, id: harvest, players: [5], observation: [text, image]}
  avalon:         {family: symbolic, id: avalon, players: [6], roles: true, observation: [text, image]}
  hanabi:         {family: symbolic, id: hanabi, players: [3], observation: [text, image]}
  tictactoe:      {family: symbolic, id: tictactoe, players: [2], observation: [text, image]}
  connect_four:   {family: symbolic, id: connect_four, players: [2], observation: [text, image]}
  gomoku:         {family: symbolic, id: gomoku, players: [2], observation: [text, image]}
  mafia:               {family: textarena, id: SecretMafia-v0, players: [8], roles: true}
  debate:              {family: textarena, id: Debate-v0, players: [2], env_kwargs: {jury_model: meta-llama/llama-3.3-70b-instruct, jury_size: 1}}
  negotiation:         {family: textarena, id: SimpleNegotiation-v0, players: [2]}
  truth_and_deception: {family: textarena, id: TruthAndDeception-v0, players: [2]}
  iterated_ipd:        {family: textarena, id: IteratedPrisonersDilemma-v0, players: [2], env_kwargs: {answer_marker: ACTION}}
  iterated_ultimatum:  {family: textarena, id: IteratedUltimatumGame-v0, players: [2], env_kwargs: {answer_marker: ACTION}}
  three_player_ipd:    {family: textarena, id: ThreePlayerIPD-v0, players: [3]}
  public_goods:        {family: textarena, id: PublicGoodsGame-v0, players: [4], env_kwargs: {answer_marker: ACTION, skip_eliminated: true}}
  liars_dice:          {family: textarena, id: LiarsDice-v0, players: [3], env_kwargs: {answer_marker: ACTION}}
  blind_auction:       {family: textarena, id: SimpleBlindAuction-v0, players: [2], env_kwargs: {answer_marker: ACTION}}
  high_society:        {family: textarena, id: HighSociety-v0, players: [2]}
  three_player_gops:   {family: textarena, id: ThreePlayerGOPS-v0, players: [3]}
