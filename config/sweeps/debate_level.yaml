# debate_fix's 'target' one step further (2026-11-20), 2B, SuperGPQA hard, a lone agent (N = 1), 200 questions.
# target c sets each generated token's projection at L12 to midpoint + c * |v| / 2 (testbed/steering.py), so c = +-1
# is the level of the trait's own positive / negative extraction answers. target_clamp_pilot.py: unsteered tokens sit
# well short of that level (the clamp almost never pulls a token back, so two-sided = one-sided), and target +1 pushes
# less than add_vector at c = 1 (sycophantic 0.70 |v| per token, opportunistic 0.47, empathy -1 0.24, assertive 0.12).
# c = +-2 is one full |v| past the midpoint: does a level past the trait's own answers move the trait more, and what
# does it cost next to l12 (add_vector, c = +-1) at about the same push? Each with its random control.
# Logs into debate_acc's dirs (log_name): 'none' and debate_fix's target c = -1..1 are shared, so
# debate_accuracy.py shows the whole dose line target -2..2.
#   1. python scripts/make_configs.py config/sweeps/debate_level.yaml --model qwen3.5-2b
#   2. bash scripts/slurm/submit_sweep.sh config/runs/debate_level_qwen3.5-2b 400 -p gpu-l40 --gres=gpu:1 -c 10 --mem=64G
name: debate_level
log_name: debate_acc
model: qwen3.5-9b
episodes: 200
max_tokens: 15360
cutoff_feedback: true
max_turns: 10                        # 3 rounds
max_parse_retries: 3
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
monitor: {layers: auto}
engine:
  concurrent_episodes: 64
  max_model_len: 32768
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}

models:
  qwen3.5-2b:
    vectors_dir: /scratch/inf0/user/nzukowsk/PersVecFast/out/persona/qwen3.5-2b/bf16
    engine: {concurrent_episodes: 128, aperture_gib: 4,
             steer: {gpus: "0", memory: 0.35}, monitor: {gpus: "0", memory: 0.4}}

traits: [assertive, sycophantic, opportunistic, empathy]
coefficients: [-2, 2]

conditions:
  none: null
  target: {select: all, layer: 12, method: target, phase: decode}
  target_random: {select: all, layer: 12, method: target, phase: decode, random_control: true}

games:
  qa_debate_hard: {family: symbolic, id: qa_debate, players: [1], env_kwargs: {dataset: supergpqa, num_rounds: 3}}
