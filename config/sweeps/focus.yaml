# Focus sweep: 5 game groups with convincing first-pass results, to 50 episodes per run, plus good_team.
#   python scripts/make_configs.py config/sweeps/focus.yaml        -> config/runs/focus/...
#   bash scripts/slurm/submit_sweep.sh config/runs/focus
# Logs go into the main sweep's dirs (log_name: main): run_ids, seeds and game settings are main's, so main's
# 10 finished episodes per run count as done and only episodes 10-49 are played (good_team is new: all 50).
# summarize_runs / report.sbatch on `main` then see both. Everything below that is shared with main.yaml must
# stay identical to it, or the extra episodes would not be comparable.
name: focus
log_name: main
model: qwen3.5-9b
episodes: 50
max_tokens: 1024
max_turns: 200
max_parse_retries: 3
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
image_size: 448
monitor: {layers: auto}
engine:
  concurrent_episodes: 64
  max_model_len: 16384
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}
# per-model overrides (make_configs --model <key>); the sweep's own model is unaffected
models:
  # tensor_parallel_size 2: each engine on 2 GPUs, 4 per job, on 80 GB GPUs only (sbatch -p gpu-all --gres=gpu:4
  # --constraint="gpu-a100|gpu-h100"). The capture buffer's rows hold all 64 x 5120 layers (9B: 32 x 4096), so 9B's
  # 8 GiB / 32768 tokens takes 20 GiB here; 16 GiB (26214 tokens) with capture calls of at most a quarter of it.
  # That buffer sits outside vLLM's share: monitor at 0.75 (60 GB of 80). It does not fit next to half the weights
  # on 48 GB GPUs (a40: 0.75 left no KV cache, 0.9 no room for the buffer; rtx8000 has no bf16).
  qwen3.8-27b:
    engine: {steer: {gpus: "0,1", memory: 0.9}, monitor: {gpus: "2,3", memory: 0.75}, aperture_gib: 16,
             capture_tokens: 6144}

traits: [evil, sarcastic, empathy, assertive, sycophantic, trustworthiness, opportunistic, agreeableness]
coefficients: [-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2]

conditions:
  none: null
  one: {select: one}
  all: {select: all}
  all_random: {select: all, random_control: true}
  prompt_one: {select: one, via: prompt}
  both_one: {select: one, via: both}
  # hidden-role games only (avalon)
  evil_team: {team: evil}
  evil_one: {team: evil, select: one}
  good_team: {team: good}            # new: the honest side's mirror of evil_team
  good_one: {team: good, select: one}

games:
  gbs:                {family: symbolic, id: gbs, players: [3, 6], observation: [text, image]}        # coordination (6p: unsteered groups succeed 30%, room to improve)
  harvest:            {family: symbolic, id: harvest, players: [5], observation: [text, image]}       # commons
  avalon:             {family: symbolic, id: avalon, players: [6], roles: true, observation: [text, image]}  # hidden roles
  # public_goods (PublicGoodsGame-v0, 4p) dropped 2026-10-19: ~49 sequential turns per episode, too slow to reach 50
  iterated_ultimatum: {family: textarena, id: IteratedUltimatumGame-v0, players: [2]}                 # bargaining
