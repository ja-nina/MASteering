# Rerun of the games whose prompts outgrew main's 16384-token context (finish_reason prompt_too_long: nothing
# generated, the parser fell back; scripts/scan_context.py, results/context_scan.csv): market entry (9B 62% of turns),
# codenames (9B 11%, 2B 15%), public goods (2B 7%). The leaking TextArena games are in tafix.yaml.
#   python scripts/make_configs.py config/sweeps/longctx.yaml [--model qwen3.5-2b]
# Six changes from main.yaml, everything else (grid, conditions, run_ids, hence seeds) is the same:
#  * answer_marker ACTION (as tafix.yaml): only the text after 'ACTION:' reaches the game. TextArena puts each
#    player's own answer back into that player's prompt, so 9B prompts grew by ~500 tokens a turn with the whole
#    answer (test 2026-11-02: market entry 15-24k, codenames sycophantic -2 29k tokens after 53 of up to 80 turns,
#    on course past 32768). With the marker every TextArena game with private reasoning uses the same protocol.
#  * skip_eliminated (public goods, market entry; test 2026-11-02): TextArena eliminates a player after repeated
#    invalid moves but then asks the eliminated player again, forever (the rotation is skipped after an invalid
#    move), so a steered game that broke the agents ran to max_turns with the prompt growing ~500 tokens a turn
#    (2B public goods sycophantic -2: 200 turns, 374-450 rejected moves, 94k tokens). With it, the turn passes to the
#    next player still in, as TextArena's own rotation does. Unsteered games end normally (43-56 turns, <10k tokens).
#  * max_model_len 32768 (main 16384): the longest prompt seen in main was 25,650 tokens (9B). It is what the capture
#    buffer of main's engine settings holds (32768 rows: 8 GiB for 9B, 4 GiB for 2B); 65536 needs a 16 GiB buffer,
#    which does not fit next to 9B on an A40 (MiaSizingError at monitor 0.9, KV cache -14 GiB at 0.5; 2026-11-02).
#  * max_tokens 4096 (main 1024): with the marker the agents reason before 'ACTION:', and 9B ran out of tokens before
#    writing it (test 2026-11-02 at 1024: codenames unsteered 18 of 26 turns cut off in the middle of real reasoning,
#    a spymaster weighing clues over the 25 words; public goods / market entry sycophantic -2 8% / 4%; at 2048 still
#    41% of codenames turns). With the marker prompts stay short (9B <= 6k tokens), so 32768 holds 4096 easily.
#  * cutoff_feedback (testbed/runner.py): an answer cut off at max_tokens before 'ACTION:' is continued, not
#    re-asked: the cut-off text, a note that the limit is reached, 'ACTION:', and the model writes its move (<= 256
#    tokens). Every way of finishing a cut-off spymaster turn produced bare board words as clues (an instant loss
#    under TextArena's unstated substring rule), never seen on uncut first tries (9B codenames, 2026-11-02/03):
#    re-asking with the cut-off answer in the prompt 7 of 47 and 4 of 14, continuing 9 of 26 (0 of 22 first tries);
#    re-asking without it reasoned as long and was cut off again. Hence the larger max_tokens: cut-offs must be rare.
#  * clue_rule + cutoff_hint (codenames; testbed/envs/textarena/ta_adapter.py): even at 4096 the median unsteered
#    spymaster turn ran to the limit, and 3349 of 3530 games of the first 9B run (2026-11-03, moved to
#    longctx_legacy) ended on a board word as the clue (884 of them first tries). TextArena ends the game on a clue
#    that is, contains or is part of a board word but never says so. Now the spymasters are told the rule, a clue
#    breaking it is refused and asked again (up to 3 times a turn; counted as clue_violations in the episode's
#    final_info), and the note that finishes a cut-off answer repeats the rule.
# Hardware: L40 (48 GB, like main's A40), partition gpu-all; 9B on two GPUs, 2B on one, main's engine settings:
#   bash scripts/slurm/submit_sweep.sh config/runs/longctx 300 -p gpu-all --gres=gpu:l40:2
#   bash scripts/slurm/submit_sweep.sh config/runs/longctx_qwen3.5-2b 300 -p gpu-all --gres=gpu:l40:1
# Its own logs (<logging_dir>/longctx[_<model>]): these games are replaced WHOLE in the analysis (every condition,
# baseline included); nothing is merged with main's episodes of the same games.
name: longctx
model: qwen3.5-9b
episodes: 10
max_tokens: 4096                     # main: 1024 (see header)
max_turns: 200
max_parse_retries: 3
cutoff_feedback: true                # main: off (see header)
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
image_size: 448
monitor: {layers: auto}
engine:
  concurrent_episodes: 64
  max_model_len: 32768                 # main: 16384; main's capture buffer (8 GiB = 32768 rows) holds it
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}   # as main
models:
  qwen3.5-2b:                          # as main (tafix.yaml): one GPU, 4 GiB buffer = 43690 rows of 24 x 2048 x 2 B
    engine: {concurrent_episodes: 128, aperture_gib: 4,
             steer: {gpus: "0", memory: 0.35}, monitor: {gpus: "0", memory: 0.4}}

traits: [evil, sarcastic, empathy, assertive, sycophantic, trustworthiness, opportunistic, agreeableness]
coefficients: [-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2]   # negative = suppress; prompt conditions use only the sign

conditions:                          # steering-group templates (testbed/steering.py); via: vector by default
  none: null                         # unsteered baseline
  one: {select: one}                 # one random agent per episode
  half: {select: fraction, fraction: 0.5}
  all: {select: all}
  evil_team: {team: evil}            # every member of the deceiving side (role games)
  evil_one: {team: evil, select: one}
  good_one: {team: good, select: one}
  all_random: {select: all, random_control: true}   # norm-matched random direction
  # the same trait as a prompt persona: its PersVecFast instruction in the system prompt
  prompt_one: {select: one, via: prompt}
  prompt_all: {select: all, via: prompt}
  both_one: {select: one, via: both}                # prompt + vector together
  evil_team_prompt: {team: evil, via: prompt}

games:
  public_goods:        {family: textarena, id: PublicGoodsGame-v0, players: [4], env_kwargs: {answer_marker: ACTION, skip_eliminated: true}}
  market_entry:        {family: textarena, id: MarketEntryGame-v0, players: [4], env_kwargs: {answer_marker: ACTION, skip_eliminated: true}}
  codenames:           {family: textarena, id: Codenames-v0, players: [4], env_kwargs: {answer_marker: ACTION, clue_rule: true,
                        cutoff_hint: "A clue must not be a word on the board, contain one, or be part of one."}}
