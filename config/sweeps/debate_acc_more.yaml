# More questions for debate_acc's 2B SuperGPQA hard cells at full strength (2026-11-19). With 50 questions, 'all' vs
# all_random at |c| = 1 showed sycophantic +-1 and empathy -1 below random by ~0.09 (about 3 SE before the SE was
# taken over distinct questions). 200 questions instead of 50 for: none, all, all_random; every trait (not only those
# three, so the follow-up is not picked by the result); c = -1 and +1; N = 1-5.
# Logs into debate_acc's dirs (log_name): same run_ids, so episodes 0-49 count as done and only 50-199 are played;
# debate_accuracy.py on debate_acc's logs then sees all 200.
#   1. python scripts/make_configs.py config/sweeps/debate_acc_more.yaml --model qwen3.5-2b
#   2. bash scripts/slurm/submit_sweep.sh config/runs/debate_acc_more_qwen3.5-2b 400 -p gpu-l40 --gres=gpu:1 -c 10 --mem=64G
name: debate_acc_more
log_name: debate_acc
model: qwen3.5-9b
episodes: 200
max_tokens: 15360
cutoff_feedback: true
max_turns: 10                        # 3 rounds
max_parse_retries: 3
logging_dir: /scratch/inf0/user/nzukowsk/MASteer/logs
monitor: {layers: auto}
engine:
  concurrent_episodes: 64
  max_model_len: 32768
  max_images: 2
  steer:   {gpus: "0", memory: 0.85}
  monitor: {gpus: "1", memory: 0.75}

models:
  qwen3.5-2b:
    vectors_dir: /scratch/inf0/user/nzukowsk/PersVecFast/out/persona/qwen3.5-2b/bf16
    engine: {concurrent_episodes: 128, aperture_gib: 4,
             steer: {gpus: "0", memory: 0.35}, monitor: {gpus: "0", memory: 0.4}}

traits: [evil, sarcastic, empathy, assertive, sycophantic, opportunistic, agreeableness]
coefficients: [-1, 1]

conditions:
  none: null
  all: {select: all}
  all_random: {select: all, random_control: true}

games:
  qa_debate_hard: {family: symbolic, id: qa_debate, players: [1, 2, 3, 4, 5], env_kwargs: {dataset: supergpqa, num_rounds: 3}}
